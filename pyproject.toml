[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lab-compose"
version = "0.2.0"
description = "Agent-friendly orchestrator for screenshot-compose and otchet-compose"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "jsonschema>=4.22",
    "otchet-compose>=0.3.0",
    "pypdf>=5.0",
    "screenshot-compose>=0.3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.11"]
mcp = ["mcp[cli]>=1.0,<2"]

[project.scripts]
lab-compose = "lab_compose.cli:main"
lab-compose-mcp = "lab_compose.mcp_server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lab_compose = ["schemas/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
