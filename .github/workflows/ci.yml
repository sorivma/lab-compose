name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: sorivma/otchet-compose
          path: .deps/otchet-compose
      - uses: actions/checkout@v4
        with:
          repository: sorivma/screenshot-compose
          path: .deps/screenshot-compose
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install -e .deps/otchet-compose -e .deps/screenshot-compose
      - run: python -m pip install -e ".[dev,mcp]"
      - run: ruff check src tests
      - run: python -m pytest -q
